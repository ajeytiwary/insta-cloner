name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Reject accidental literal escapes
        run: |
          python - <<'PY'
          import io
          import tokenize
          from pathlib import Path
          bad = []
          for path in sorted(Path("insta_cloner").glob("*.py")):
              source = path.read_text(encoding="utf-8")
              protected = [False] * len(source)
              offsets = [0]
              for line in source.splitlines(keepends=True):
                  offsets.append(offsets[-1] + len(line))
              try:
                  tokens = tokenize.generate_tokens(io.StringIO(source).readline)
                  for tok in tokens:
                      if tok.type in {tokenize.STRING, tokenize.COMMENT}:
                          start = offsets[tok.start[0]-1] + tok.start[1]
                          end = offsets[tok.end[0]-1] + tok.end[1]
                          for i in range(start, min(end, len(protected))):
                              protected[i] = True
              except tokenize.TokenError:
                  pass
              for needle in ("\\\\n", "\\\\r", "\\\\t"):
                  pos = 0
                  while True:
                      pos = source.find(needle, pos)
                      if pos < 0:
                          break
                      if not protected[pos]:
                          bad.append(f"{path}: literal {needle!r} at offset {pos}")
                      pos += len(needle)
          if bad:
              print("\\n".join(bad))
              raise SystemExit(1)
          PY

      - name: Syntax check
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path
          failed = False
          for path in sorted(Path("insta_cloner").glob("*.py")):
              try:
                  py_compile.compile(str(path), doraise=True)
                  print("OK", path)
              except Exception as exc:
                  failed = True
                  print("FAIL", path, repr(exc))
          if failed:
              raise SystemExit(1)
          PY

      - name: Validate deployment files
        run: |
          bash -n deploy.sh
          bash -n deploy/gcp/deploy.sh
          python - <<'PY'
          import pathlib
          import yaml

          class CloudFormationLoader(yaml.SafeLoader):
              pass

          def intrinsic(loader, tag_suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  value = loader.construct_scalar(node)
              elif isinstance(node, yaml.SequenceNode):
                  value = loader.construct_sequence(node)
              else:
                  value = loader.construct_mapping(node)
              return {tag_suffix: value}

          CloudFormationLoader.add_multi_constructor("!", intrinsic)

          cfn = yaml.load(
              pathlib.Path("deploy/aws/cloudformation.yaml").read_text(),
              Loader=CloudFormationLoader,
          )
          compose = yaml.safe_load(pathlib.Path("docker-compose.yml").read_text())
          assert isinstance(cfn, dict) and "Resources" in cfn
          assert isinstance(compose, dict) and "services" in compose
          print("CloudFormation and Compose YAML parsed")
          PY

      - name: Test
        run: pytest -q

      - name: CLI smoke tests
        run: |
          insta-cloner --help
          insta-cloner models
          insta-cloner clone --help
          insta-cloner ui --help

      - name: Build wheel
        run: |
          pip install build
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          insta-cloner --help
