name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax check
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path
          failed = False
          for path in sorted(Path("insta_cloner").glob("*.py")):
              try:
                  py_compile.compile(str(path), doraise=True)
                  print("OK", path)
              except Exception as exc:
                  failed = True
                  print("FAIL", path, repr(exc))
          if failed:
              raise SystemExit(1)
          PY

      - name: Test
        run: pytest -q

      - name: CLI smoke tests
        run: |
          insta-cloner --help
          insta-cloner models
          insta-cloner clone --help
          insta-cloner ui --help

      - name: Build wheel
        run: |
          pip install build
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          insta-cloner --help
