[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insta-cloner"
version = "0.1.0"
description = "Analyze an Instagram profile's visual language and turn it into an original-content style brief."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "instaloader>=4.14",
  "Pillow>=10.0",
  "numpy>=1.26",
  "pydantic>=2.8",
  "typer>=0.12",
  "rich>=13.7",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
clip = [
  "clip-interrogator>=0.6.0",
  "torch>=2.2",
  "torchvision>=0.17",
]
pose = [
  "controlnet-aux>=0.0.9",
  "torch>=2.2",
  "torchvision>=0.17",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
insta-cloner = "insta_cloner.cli:app"

[tool.setuptools.packages.find]
include = ["insta_cloner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
